workflow:
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

image: node:24-slim@sha256:4660b1ca8b28d6d1906fd644abe34b2ed81d15434d26d845ef0aced307cf4b6f

include:
  - component: gitlab.com/thelabnyc/thelab-ci-components/review@0.7.0

test:
  script:
    - npm ci
    - npm run lib:build
  cache:
    paths:
      - node_modules/

deploy:
  script:
    - npm ci
    - npm run lib:build
    - echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}'>.npmrc
    - npm publish
  only:
    - tags
  cache:
    paths:
      - node_modules/
  artifacts:
    paths:
      - dist/
