workflow:
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

image: node:24-slim@sha256:0207704d1339be2e835577e970352926f5cf630b67356087f28a9b988ba90a82

include:
  - component: gitlab.com/thelabnyc/thelab-ci-components/review@0.6.2

test:
  script:
    - npm ci
    - npm run lib:build
  cache:
    paths:
      - node_modules/

deploy:
  script:
    - npm ci
    - npm run lib:build
    - echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}'>.npmrc
    - npm publish
  only:
    - tags
  cache:
    paths:
      - node_modules/
  artifacts:
    paths:
      - dist/
