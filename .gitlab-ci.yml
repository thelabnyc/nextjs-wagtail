image: node:24-slim@sha256:8c996a5c6dbf6fe218caf6af9de865135991cb9d85bcd7116850908ae038d278

before_script:
  - npm ci

cache:
  paths:
    - node_modules/

test:
  script:
    - npm run lib:build

deploy:
  script:
    - npm run lib:build
    - echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}'>.npmrc
    - npm publish
  only:
    - tags
  artifacts:
    paths:
      - dist/
