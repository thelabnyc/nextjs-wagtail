workflow:
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

default:
  tags:
    - thelab-arm64

image: node:24-slim@sha256:4e6b70dd6cbfc88c8157ba19aa3d9f9cce6ba4703576d55459e45efcbc9c5f5d

include:
  - component: gitlab.com/thelabnyc/thelab-ci-components/review@0.8.4

test:
  script:
    - npm ci
    - npm run lib:build
  cache:
    paths:
      - node_modules/

deploy:
  script:
    - npm ci
    - npm run lib:build
    - echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}'>.npmrc
    - npm publish
  only:
    - tags
  cache:
    paths:
      - node_modules/
  artifacts:
    paths:
      - dist/
