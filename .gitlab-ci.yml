workflow:
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

default:
  tags:
    - thelab-arm64

image: node:26-slim@sha256:e6bedef217677b276c591795e169840edd9096dbf13f29df8ef8d1856b8820bc

include:
  - component: gitlab.com/thelabnyc/thelab-ci-components/review@0.11.0

test:
  script:
    - npm ci
    - npm run lib:build
  cache:
    paths:
      - node_modules/

deploy:
  script:
    - npm ci
    - npm run lib:build
    - echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}'>.npmrc
    - npm publish
  only:
    - tags
  cache:
    paths:
      - node_modules/
  artifacts:
    paths:
      - dist/
