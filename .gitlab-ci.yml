workflow:
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

default:
  tags:
    - thelab-arm64

image: node:24-slim@sha256:06e5c9f86bfa0aaa7163cf37a5eaa8805f16b9acb48e3f85645b09d459fc2a9f

include:
  - component: gitlab.com/thelabnyc/thelab-ci-components/review@0.8.4

test:
  script:
    - npm ci
    - npm run lib:build
  cache:
    paths:
      - node_modules/

deploy:
  script:
    - npm ci
    - npm run lib:build
    - echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}'>.npmrc
    - npm publish
  only:
    - tags
  cache:
    paths:
      - node_modules/
  artifacts:
    paths:
      - dist/
