image: node:20-slim@sha256:9513b8d4c59c7c35e76934765add45efb89102d639f945341d7948b168237633

before_script:
  - npm ci

cache:
  paths:
    - node_modules/

test:
  script:
    - npm run lib:build

deploy:
  script:
    - npm run lib:build
    - echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}'>.npmrc
    - npm publish
  only:
    - tags
  artifacts:
    paths:
      - dist/
