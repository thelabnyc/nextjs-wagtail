image: node:24-slim@sha256:3207eadbf6e1cb68087bcde8d87ab52e904830dce49af6382bdda015bbc5a423

before_script:
  - npm ci

cache:
  paths:
    - node_modules/

test:
  script:
    - npm run lib:build

deploy:
  script:
    - npm run lib:build
    - echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}'>.npmrc
    - npm publish
  only:
    - tags
  artifacts:
    paths:
      - dist/
